# Render blueprint: a Docker background worker with a persistent disk at /data.
# Render builds from this repository; GitHub Actions only runs tests and checks the Docker build.
# The disk pins the service to one instance, which is the single-owner rule the agent needs.
services:
  - type: worker
    name: xarnes-agent
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      # Required: Render prompts for these when creating the Blueprint.
      - key: GITHUB_REPO
        sync: false
      - key: SKILL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: STATUS_CONTEXT
        sync: false
      # Per-instance: each extra slot needs its own Codex sign-in on this service's disk, so a
      # blueprint sync must never change it. Start with 1; raise it after signing in the extra slots.
      - key: MAX_CONCURRENCY
        sync: false

      # Optional watcher settings: applied automatically and shown on the
      # service's Environment page. MODEL and FAST_MODE match agent.env.example;
      # the other values match the runner's defaults.
      - key: TARGET_BRANCHES
        value: main,dev
      - key: MAX_ATTEMPTS
        value: "3"
      - key: POLL_SECONDS
        value: "15"
      - key: RUN_EXISTING
        value: "false"
      - key: WATCH_UPDATES
        value: "true"
      - key: ENGINE
        value: codex
      - key: MODEL
        value: gpt-6-sol
      - key: FAST_MODE
        value: "false"
      - key: TASK_TIMEOUT_SECONDS
        value: "1800"

      # Advanced watcher settings. Keep persistent paths on the /data disk.
      - key: SANDBOX
        value: container
      - key: ALLOW_NETWORK
        value: "false"
      - key: DATA_DIR
        value: /data
      - key: CODEX_HOME
        value: /data/codex
      - key: CLAUDE_CONFIG_DIR
        value: /data/claude
      - key: CODEX_BIN
        value: codex
