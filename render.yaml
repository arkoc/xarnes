# Render blueprint: a Docker background worker with a persistent disk at /data.
# Render builds from this repository; GitHub Actions only runs tests and checks the Docker build.
# The disk pins the service to one instance, which is the single-owner rule the agent needs.
services:
  - type: worker
    name: xarnes-agent
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      # The Blueprint sets only what a deployment must know; Render prompts for each of these once.
      # Every other setting (engine, model, branches, concurrency, check name, timeouts, ...) starts
      # from the runner's defaults and is changed on the service's Environment page. A Blueprint
      # sync never touches variables that this file does not mention, so those choices survive syncs.
      - key: GITHUB_REPO
        sync: false
      - key: SKILL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
